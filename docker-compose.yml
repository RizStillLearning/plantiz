services:
  app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ""
    environment:
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plantiz}:${POSTGRES_PASSWORD:-plantiz}@db:5432/${POSTGRES_DB:-plantiz}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantiz}
      POSTGRES_DB: ${POSTGRES_DB:-plantiz}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantiz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
