# Docker's embedded DNS. Re-resolving every 10 seconds lets NGINX follow
# backend replicas as they are added, removed or restarted on new addresses.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream plantiz_api {
    zone plantiz_api 64k;
    least_conn;
    # `resolve` expands the compose service name to every replica's address.
    server backend:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    # Locations below set caching with `expires` rather than add_header, so
    # these headers are inherited everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Photos for identification; the app itself rejects anything over 10 MB.
        client_max_body_size 12m;

        proxy_pass http://plantiz_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Try another replica if one is down. POSTs are only retried when the
        # request never reached a backend, so nothing is processed twice.
        proxy_next_upstream error timeout;
    }

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Prerendered pages: /plants is served from plants.html.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
